spring:
  application:
    name: tajisali-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tajisali?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:tajisali}
    password: ${DB_PASSWORD:tajisali}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

external:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:60s}
  exchange:
    base-url: ${EXCHANGE_API_BASE_URL:}
    api-key: ${EXCHANGE_API_KEY:}
