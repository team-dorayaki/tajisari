services:
  mysql:
    image: mysql:8.4
    container_name: tajisali-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tajisali}
      MYSQL_USER: ${MYSQL_USER:-tajisali}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tajisali}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tajisali-root}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
